<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>InBrief_AI: Video Summarizer</title>
  <script defer src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script defer>
    async function handleSubmit(e) {
      e.preventDefault();
      const form = document.getElementById("uploadForm");
      const formData = new FormData(form);

      const status = document.getElementById("status");
      const result = document.getElementById("result");
      status.innerText = "⏳ Processing... This might take a while.";

      try {
        const res = await axios.post("/summarize/", formData);
        status.innerText = "✅ Done!";
        result.innerHTML = `
          <h3>📜 Transcript <button onclick="toggleTranscript()" class="toggle-btn">👁️ Toggle</button></h3>
          <div id="transcriptBox">
            <pre>${res.data.transcript}</pre>
          </div>
          <h3>📝 Summary</h3>
          <pre>${res.data.summary}</pre>
        `;
      } catch (err) {
        status.innerText = "❌ Something went wrong.";
        console.error(err);
      }
    }

    function toggleTranscript() {
      const box = document.getElementById("transcriptBox");
      box.style.display = box.style.display === "none" ? "block" : "none";
    }
  </script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: white;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      margin-top: 3rem;
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
    }

    h1 {
      text-align: center;
      color: #333;
      font-size: 2rem;
      margin-bottom: 1.5rem;
    }

    form label {
      font-weight: bold;
      display: block;
      margin-top: 1rem;
      color: #444;
    }

    input[type="file"],
    select,
    button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      background-color: #6c63ff;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #574b90;
    }

    .toggle-btn {
      font-size: 0.8rem;
      padding: 0.3rem 0.5rem;
      margin-left: 10px;
      background: #eee;
      color: #333;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #status {
      margin-top: 1rem;
      font-weight: bold;
      color: #555;
      text-align: center;
    }

    pre {
      background: #f0f0f0;
      padding: 1rem;
      border-radius: 8px;
      white-space: pre-wrap;
      font-size: 0.95rem;
      color: #222;
    }

    h3 {
      margin-top: 2rem;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 InBrief_AI: Video Summarizer</h1>

    <form id="uploadForm" onsubmit="handleSubmit(event)">
      <label>Upload Video</label>
      <input type="file" name="video" accept="video/*" required />

      <label>Format:</label>
      <select name="format_type">
        <option value="paragraphs">Paragraphs</option>
        <option value="bullet points">Bullet Points</option>
      </select>

      <label>Length:</label>
      <select name="length">
        <option value="short">Short</option>
        <option value="medium" selected>Medium</option>
        <option value="long">Long</option>
      </select>

      <button type="submit">🧠 Summarize</button>
    </form>

    <p id="status"></p>
    <div id="result"></div>
  </div>
</body>
</html>
